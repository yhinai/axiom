<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Axiom kernel pipeline</title>
  <desc id="desc">Inputs flow through the Recompute W/U, Chunk Fwd H, and Chunk Fwd O Gated DeltaNet kernels, while Causal Conv1D forms an independent Mamba-style path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#273449"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <text x="70" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="650" fill="#93c5fd" letter-spacing="2">FOUR SPECIALIZED KERNELS</text>
  <text x="70" y="119" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="38" font-weight="720" fill="#f8fafc">One sequence pipeline. No generic work.</text>

  <text x="70" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="650" fill="#94a3b8" letter-spacing="1.5">GATED DELTANET PATH</text>
  <rect x="70" y="220" width="300" height="128" rx="22" fill="url(#card)" stroke="#334155"/>
  <circle cx="108" cy="258" r="17" fill="#2563eb"/><text x="108" y="264" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="white">01</text>
  <text x="138" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="680" fill="#f8fafc">Recompute W/U</text>
  <text x="108" y="307" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#94a3b8">WY transform · tensor cores</text>

  <path d="M386 284 H434" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)" filter="url(#glow)"/>
  <rect x="450" y="220" width="300" height="128" rx="22" fill="url(#card)" stroke="#334155"/>
  <circle cx="488" cy="258" r="17" fill="#7c3aed"/><text x="488" y="264" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="white">02</text>
  <text x="518" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="680" fill="#f8fafc">Chunk Fwd H</text>
  <text x="488" y="307" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#94a3b8">Inter-chunk recurrence</text>

  <path d="M766 284 H814" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)" filter="url(#glow)"/>
  <rect x="830" y="220" width="300" height="128" rx="22" fill="url(#card)" stroke="#334155"/>
  <circle cx="868" cy="258" r="17" fill="#a855f7"/><text x="868" y="264" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="white">03</text>
  <text x="898" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="680" fill="#f8fafc">Chunk Fwd O</text>
  <text x="868" y="307" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#94a3b8">Attention + global state</text>

  <text x="70" y="401" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="650" fill="#94a3b8" letter-spacing="1.5">MAMBA PATH</text>
  <rect x="70" y="421" width="1060" height="64" rx="20" fill="url(#card)" stroke="#334155"/>
  <circle cx="108" cy="453" r="17" fill="#0ea5e9"/><text x="108" y="459" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="white">04</text>
  <text x="138" y="460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="680" fill="#f8fafc">Causal Conv1D</text>
  <text x="1082" y="459" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#94a3b8">Depthwise · fused causal masking · no host padding</text>
</svg>
